name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Recompute paper numbers and test analysis code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The tests need only the analysis stack; PyTorch is not required because
      # they work from the committed per-image prediction files.
      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn pillow pytest ruff

      - name: Lint (correctness checks only)
        run: ruff check --select E9,F63,F7,F82 scripts tests

      - name: Every script compiles
        run: python -m compileall -q scripts tests

      - name: Recompute headline results and run unit tests
        run: pytest -v
